name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Use newer Android SDK
        run: |
          sed -i 's/compileSdk = 34/compileSdk = 35/; s/targetSdk = 34/targetSdk = 35/' app/build.gradle.kts
          sed -i 's/8\.5\.2/8.6.1/' build.gradle.kts
      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Show error summary
        if: failure()
        run: |
          { echo '```'; grep -n -A15 "What went wrong" build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: RideLink-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
